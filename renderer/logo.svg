<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente de fondo negro profundo oficial -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0F"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Resplandor sutil verde lima de la marca -->
    <filter id="limeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#D8FF00" flood-opacity="0.5"/>
    </filter>

    <!-- Resplandor del marco -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B3045"/>
      <stop offset="50%" stop-color="#141722"/>
      <stop offset="100%" stop-color="#D8FF00" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Gradiente de la Tríada Oficial: Lima, Rosa y Violeta -->
    <linearGradient id="triadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D8FF00"/>
      <stop offset="50%" stop-color="#FF006E"/>
      <stop offset="100%" stop-color="#6B35FF"/>
    </linearGradient>
  </defs>

  <!-- Base del Icono con Squircle moderno -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Rejilla arquitectónica técnica de fondo (Pág. 15 y 16) -->
  <path d="M 64 160 H 448 M 64 256 H 448 M 64 352 H 448 M 160 64 V 448 M 256 64 V 448 M 352 64 V 448" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1.5"/>

  <!-- Logotipo Oficial HCP + en negativo (Pág. 18 y 19) -->
  <g transform="translate(62, 175)">
    <!-- Letra H con corte arquitectónico oficial en el travesaño (Pág. 1 y 14) -->
    <path d="M 0 0 H 26 V 56 L 38 70 L 26 84 V 140 H 0 Z" fill="#FFFFFF"/>
    <path d="M 38 56 H 72 V 0 H 98 V 140 H 72 V 84 H 38 Z" fill="#FFFFFF"/>

    <!-- Letra C (Grotesca geométrica limpia Px Grotesk) -->
    <path d="M 218 36 C 208 12 190 0 166 0 C 132 0 108 26 108 70 C 108 114 132 140 166 140 C 190 140 208 128 218 104 H 190 C 182 116 174 120 166 120 C 146 120 134 102 134 70 C 134 38 146 20 166 20 C 174 20 182 24 190 36 Z" fill="#FFFFFF"/>

    <!-- Letra P -->
    <path d="M 234 0 H 286 C 310 0 326 14 326 44 C 326 74 310 88 286 88 H 260 V 140 H 234 Z M 260 20 V 68 H 284 C 296 68 302 60 302 44 C 302 28 296 20 284 20 Z" fill="#FFFFFF"/>

    <!-- Isotipo Oficial + (Estructura en ángulo recto inferior + Evolución curva superior en HCP Lime, Pág. 15 y 19) -->
    <g transform="translate(346, 16)" filter="url(#limeGlow)">
      <!-- Símbolo plus: ángulo recto en base inferior e izquierda, redondeado en superior y derecha -->
      <path d="M 24 0 C 38 0 48 10 48 24 V 40 H 84 C 94 40 102 48 102 58 C 102 68 94 74 84 74 H 48 V 116 H 24 V 74 H 0 V 40 H 24 V 24 C 24 10 28 0 28 0 Z" fill="#D8FF00"/>
    </g>
  </g>

  <!-- Barra de Tríada de Marca (Architecture, Engineering, Urban Planning) -->
  <rect x="156" y="398" width="200" height="7" rx="3.5" fill="url(#triadGrad)"/>

  <!-- Subtítulo de Urban Planning en HCP Silver -->
  <text x="256" y="432" fill="#CBD5E1" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="4" text-anchor="middle">URBAN PLANNING</text>
</svg>
